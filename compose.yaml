name: margem-ifood99
services:
  app:
    image: margem-ifood99:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3333"
      DATA_DIR: /app/data
      TZ: America/Sao_Paulo
    volumes:
      - margem-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  margem-data:
    external: true
    name: margem_ifood99_data
